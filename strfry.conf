# Minimal strfry config for local ContentPort development.
# Not for production: no auth, no rate limits, no TLS, all events accepted.

db = "/app/strfry-db/"

relay {
    bind = "0.0.0.0"
    port = 7777

    info {
        name        = "contentport-dev"
        description = "Local development relay for ContentPort"
        pubkey      = "7c2ce4dbe39f80164627d31215b49b49b3c4f923c5cf8e23fbe2e84d4b1a45bb"
        contact     = ""
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds         = 55
    enableTcpKeepalive      = true
}

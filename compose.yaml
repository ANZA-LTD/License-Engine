name: contentport

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Local development credentials only; match backend/.env.example.
      POSTGRES_USER: contentport
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: contentport
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/migrations/001_offers.sql:/docker-entrypoint-initdb.d/001_offers.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentport -d contentport"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:

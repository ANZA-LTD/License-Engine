name: contentport

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # Local development credentials only; match backend/.env.example.
      POSTGRES_USER: contentport
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: contentport
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentport -d contentport"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Local Nostr relay for development. Accepts every event: no auth, no limits.
  # Matches NOSTR_RELAYS in backend/.env (ws://localhost:7777).
  strfry:
    image: dockurr/strfry:latest
    container_name: contentport-strfry
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - strfry_data:/app/strfry-db
      - ./strfry.conf:/etc/strfry.conf:ro

volumes:
  postgres_data:
  strfry_data:

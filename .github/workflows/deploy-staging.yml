name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker africa-south1-docker.pkg.dev --quiet
      - run: docker build -t africa-south1-docker.pkg.dev/anza-staging/backend/api:${{ github.sha }} ./backend
      - run: docker push africa-south1-docker.pkg.dev/anza-staging/backend/api:${{ github.sha }}
      - run: gcloud run deploy anza-staging --image africa-south1-docker.pkg.dev/anza-staging/backend/api:${{ github.sha }} --region africa-south1 --platform managed --allow-unauthenticated --add-cloudsql-instances anza-staging:africa-south1:anza-staging-db

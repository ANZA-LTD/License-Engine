name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker africa-south1-docker.pkg.dev --quiet
      - run: docker build -t africa-south1-docker.pkg.dev/anza-staging/backend/api:${{ github.sha }} ./backend
      - run: docker push africa-south1-docker.pkg.dev/anza-staging/backend/api:${{ github.sha }}
      - run: gcloud run deploy anza-staging --image africa-south1-docker.pkg.dev/anza-staging/backend/api:${{ github.sha }} --region africa-south1 --platform managed --allow-unauthenticated --add-cloudsql-instances anza-staging:africa-south1:anza-staging-db
      - run: |
          docker build -t africa-south1-docker.pkg.dev/anza-staging/licence-engine-frontend:${{ github.sha }} \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://anza-staging-172765911669.africa-south1.run.app/api \
            --build-arg NEXT_PUBLIC_NOSTR_OFFER_KIND=9998 \
            --build-arg NEXT_PUBLIC_NOSTR_ATTESTOR_PUBKEY=22b55780785d437e3357b4e4c5ad10c8c4c96ed9616bf70a57591948433ec2e1 \
            ./frontend
      - run: gcloud artifacts repositories describe licence-engine-frontend --location=africa-south1 || gcloud artifacts repositories create licence-engine-frontend --repository-format=docker --location=africa-south1
      - run: docker push africa-south1-docker.pkg.dev/anza-staging/licence-engine-frontend:${{ github.sha }}
      - run: gcloud run deploy licence-engine-frontend \
          --image africa-south1-docker.pkg.dev/anza-staging/licence-engine-frontend:${{ github.sha }} \
          --region africa-south1 --platform managed --allow-unauthenticated
